<div class="container">
  <!-- Breadcrumbs -->
  <nav class="breadcrumbs">
    <a href="#">HOME</a>
    <span class="separator">></span>
    <a href="#">SHOP ALL</a>
    <span class="separator">></span>
    <span class="current">LUXE CORE JACKET</span>
  </nav>

  <!-- Product Main Layout -->
  <div class="product-grid">
    
    <!-- Left Column: Gallery -->
    <div class="gallery-container">
      <div class="thumbnail-list">
        <img src="https://via.placeholder.com/100" class="thumb active" alt="Thumb 1" />
        <img src="https://via.placeholder.com/100" class="thumb" alt="Thumb 2" />
        <img src="https://via.placeholder.com/100" class="thumb" alt="Thumb 3" />
        <img src="https://via.placeholder.com/100" class="thumb" alt="Thumb 4" />
      </div>
      <div class="main-image">
        <img src="https://via.placeholder.com/600x700" alt="Luxe Core Jacket" />
      </div>
    </div>

    <!-- Right Column: Product Info -->
    <div class="details-container">
      <span class="tag">PREMIUM COLLECTION</span>
      <h1 class="title">Luxe Core Jacket</h1>

      <!-- Rating -->
      <div class="rating">
        <span class="stars">★★★★★</span>
        <span class="review-count">(128 Reviews)</span>
      </div>

      <!-- Price Section -->
      <div class="price-section">
        <span class="current-price">$295.00</span>
        <span class="old-price">$350.00</span>
        <span class="badge">15% OFF</span>
      </div>

      <hr class="divider" />

      <!-- Color Selection -->
      <div class="option-group">
        <label class="option-label">COLOR: <span class="selected-value">Midnight Navy</span></label>
        <div class="color-options">
          <button class="color-swatch active" style="background-color: #1b263b;"></button>
          <button class="color-swatch" style="background-color: #415a77;"></button>
          <button class="color-swatch" style="background-color: #2b2d42;"></button>
        </div>
      </div>

      <!-- Size Selection -->
      <div class="option-group">
        <div class="size-header">
          <label class="option-label">SIZE</label>
          <a href="#" class="size-guide">SIZE GUIDE</a>
        </div>
        <div class="size-options">
          <button class="size-btn">S</button>
          <button class="size-btn active">M</button>
          <button class="size-btn">L</button>
          <button class="size-btn">XL</button>
        </div>
      </div>

      <!-- Quantity Selector -->
      <div class="option-group">
        <label class="option-label">QUANTITY</label>
        <div class="quantity-selector">
          <button class="qty-btn">-</button>
          <span class="qty-value">1</span>
          <button class="qty-btn">+</button>
        </div>
      </div>

      <!-- Add to Cart Button -->
      <button class="add-to-cart-btn">
        <span class="icon">🛍️</span> ADD TO CART
      </button>

    </div>
  </div>
</div>
