<div class="sky-bg auth-page">
  <div class="cloud" style="width: 180px; height: 60px; top: 12%; left: 6%"></div>
  <div class="cloud" style="width: 120px; height: 40px; top: 18%; left: 10%; opacity: 0.7"></div>
  <div class="cloud" style="width: 200px; height: 70px; bottom: 8%; right: 5%"></div>
  <div
    class="cloud"
    style="width: 140px; height: 50px; bottom: 14%; right: 12%; opacity: 0.7"
  ></div>
  <div
    class="cloud"
    style="width: 100%; height: 180px; bottom: -60px; left: 0; border-radius: 0"
  ></div>
  <div
    class="orbit-ring"
    style="width: 520px; height: 520px; top: 50%; left: 50%; transform: translate(-50%, -50%)"
  ></div>

  <div class="card auth-card">
    <div class="auth-icon-wrap">
      <div class="auth-icon-box">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="auth-icon"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M18 7.5v3m0 0v3m0-3h3m-3 0h-3m-2.25-4.125a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zM3 19.235v-.11a6.375 6.375 0 0112.75 0v.109A12.318 12.318 0 019.374 21c-2.331 0-4.512-.645-6.374-1.766z"
          />
        </svg>
      </div>
    </div>

    <h1 class="auth-title">Create your account</h1>
    <p class="auth-subtitle">Create your Shoppy account and start shopping</p>

    <form [formGroup]="signupForm" (ngSubmit)="onSubmit()" class="auth-form" novalidate>
      <div>
        <div
          class="input-field input-row"
          [class.input-error]="fullName.invalid && fullName.touched"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="field-icon"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M17.982 18.725A7.488 7.488 0 0012 15.75a7.488 7.488 0 00-5.982 2.975m11.963 0a9 9 0 10-11.963 0m11.963 0A8.966 8.966 0 0112 21a8.966 8.966 0 01-5.982-2.275M15 9.75a3 3 0 11-6 0 3 3 0 016 0z"
            />
          </svg>
          <input
            type="text"
            formControlName="fullName"
            placeholder="Full name"
            class="text-input"
          />
        </div>
      </div>

      <div>
        <div class="input-field input-row" [class.input-error]="email.invalid && email.touched">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="field-icon"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75"
            />
          </svg>
          <input type="email" formControlName="email" placeholder="Email" class="text-input" />
        </div>
      </div>

      <div>
        <div
          class="input-field input-row"
          [class.input-error]="password.invalid && password.touched"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="field-icon"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"
            />
          </svg>
          <input
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            placeholder="Password"
            (input)="onPasswordInput(password.value)"
            class="text-input"
          />
          <button
            type="button"
            (click)="togglePasswordVisibility()"
            class="toggle-btn"
            aria-label="Toggle password visibility"
          >
            @if (showPassword()) {
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="eye-icon"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="2"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"
                />
              </svg>
            } @else {
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="eye-icon"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="2"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"
                />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                />
              </svg>
            }
          </button>
        </div>

        <!-- Password strength meter -->
        <div class="strength-bar">
          <div
            class="strength-fill"
            [style.backgroundColor]="strength().color"
            [style.width]="strength().width"
          ></div>
        </div>
        <p class="strength-label">{{ strength().label }}</p>
      </div>

      <div>
        <div class="input-field input-row" [class.input-error]="passwordsMismatch">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="field-icon"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
            />
          </svg>
          <input
            type="password"
            formControlName="confirmPassword"
            placeholder="Confirm password"
            class="text-input"
          />
        </div>
        @if (passwordsMismatch) {
          <p class="field-error">Passwords don't match</p>
        }
      </div>

      <button type="submit" [disabled]="isSubmitting()" class="btn-primary submit-btn">
        {{ isSubmitting() ? 'Creating account…' : 'Create Account' }}
      </button>

      @if (authError()) {
        <p class="auth-error">{{ authError() }}</p>
      }
    </form>

    <p class="auth-switch">
      Already have an account?
      <a routerLink="/login" class="auth-switch-link">Sign in</a>
    </p>
  </div>
</div>
