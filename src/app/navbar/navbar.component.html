<header class="header">
  <div class="header-content">
    <h3 class="title" routerLink="">Shoppy</h3>
    <nav class="nav-box">
      <ul class="nav-links">
        <li><a class="nav-link" routerLink="/home" routerLinkActive="active-nav">Home</a></li>
        <li><a class="nav-link" routerLink="/profile" routerLinkActive="active-nav">Profile</a></li>
        <li><a class="nav-link" routerLink="/cart" routerLinkActive="active-nav">Cart</a></li>
        <li class="cart-btn-element">
          <a class="cart-btn" routerLink="/cart" routerLinkActive="active-nav">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              fill="currentColor"
              class="bi bi-cart"
              viewBox="0 0 16 16"
            >
              <path
                d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5M3.102 4l1.313 7h8.17l1.313-7zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4m7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4m-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2m7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2"
              />
            </svg>
            <span class="cart-counter">({{ cartCount }})</span>
          </a>
        </li>
      </ul>
      <div class="user-auth-action-btn">
        <button class="navbar-btn login">Login</button>
        <button class="navbar-btn signup">Signup</button>
        <button class="navbar-btn logout">Logout</button>
      </div>
    </nav>
  </div>
</header>
